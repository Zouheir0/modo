<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 14th Birthday, Modo!</title>
    <style>
        /* === BASE & SCROLL STYLES === */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        body { 
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e); 
            color: white; 
            overflow-x: hidden; 
        }

        /* High-Performance Canvas Confetti */
        #confettiCanvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 999;
        }

        /* === HEADER === */
        .header-container { max-width: 900px; margin: 10vh auto; padding: 20px; text-align: center; position: relative; z-index: 10; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        h1 { font-size: 3.5rem; margin-bottom: 10px; color: #f2d74e; text-shadow: 0 0 20px rgba(242, 215, 78, 0.5); }
        p.subtitle { font-size: 1.2rem; color: #e0e0e0; }
        
        /* === 3D SCROLL GALLERY === */
        .scroll-gallery-wrapper { height: 600vh; position: relative; } 
        
        .camera { 
            position: sticky; top: 0; height: 100vh; width: 100vw; overflow: hidden; 
            perspective: 1200px; 
            display: flex; justify-content: center; align-items: center; 
        }
        
        .scene { 
            width: 100%; height: 100%; 
            transform-style: preserve-3d; position: absolute; top: 0; left: 0; 
            will-change: transform; 
            backface-visibility: hidden; 
        }
        
        .floor {
            position: absolute; top: 50%; left: 50%;
            width: 4000px; height: 8000px; 
            margin-left: -2000px; 
            transform: translateY(300px) rotateX(90deg) translateY(-3000px);
            background: repeating-linear-gradient( 45deg, #1b3815, #1b3815 100px, #22471a 100px, #22471a 200px );
            opacity: 0.8;
        }

        .decoration {
            position: absolute; top: 50%; left: 50%; font-size: 4rem;
            transform-style: preserve-3d; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));
            animation: floatDeco 4s infinite ease-in-out alternate;
        }
        @keyframes floatDeco { 0% { margin-top: 0; } 100% { margin-top: -15px; } }

        .table-1 { transform: translate3d(-30vw, 50px, -500px); }
        .table-2 { transform: translate3d(30vw, 50px, -1800px); }
        .table-3 { transform: translate3d(-30vw, 50px, -3200px); }
        .table-4 { transform: translate3d(30vw, 50px, -4200px); }

        /* FIXED PORTRAITS */
        .portrait {
            position: absolute; top: 50%; left: 50%; 
            width: 320px; height: 420px;
            margin-top: -210px; margin-left: -160px;
            background: #111; 
            border: 15px solid #d4af37; 
            border-radius: 5px; padding: 10px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            display: flex; align-items: center; justify-content: center;
            backface-visibility: hidden;
            cursor: pointer; /* Indicates it can be clicked */
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .portrait:hover { box-shadow: 0 20px 60px rgba(242, 215, 78, 0.4); }

        .portrait img { width: 100%; height: 100%; object-fit: contain; border-radius: 2px; }

        .p1 { transform: translate3d(20vw, -30px, -200px) rotateY(-10deg); }      
        .p2 { transform: translate3d(-20vw, -30px, -1500px) rotateY(10deg); }  
        .p3 { transform: translate3d(20vw, -30px, -3000px) rotateY(-10deg); }  
        .p4 { transform: translate3d(-20vw, -30px, -4500px) rotateY(10deg); }  
        .p5 { transform: translate3d(0, -30px, -6000px); width: 360px; height: 480px; margin-left:-180px; margin-top:-240px; border-color: #fff; box-shadow: 0 0 50px rgba(255,255,255,0.5); } 

        .scroll-indicator { position: absolute; bottom: 5%; left: 50%; transform: translateX(-50%); font-size: 1.2rem; animation: bounce 2s infinite; font-weight: bold; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 20px; z-index: 20; }
        @keyframes bounce { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, 10px); } }

        /* === INTERACTIVE SECTIONS === */
        .interactive-container { max-width: 900px; margin: 10vh auto 15vh auto; padding: 20px; text-align: center; position: relative; z-index: 10; display: flex; flex-direction: column; gap: 40px; }
        
        .form-group { display: flex; flex-direction: column; gap: 15px; max-width: 500px; margin: 0 auto; }
        input, textarea { width: 100%; padding: 15px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 10px; color: white; font-size: 1rem; outline: none; transition: border 0.3s; }
        input:focus, textarea:focus { border-color: #f2d74e; }
        
        .btn { background: linear-gradient(45deg, #d4af37, #f2d74e); color: #1a1a2e; border: none; padding: 15px 30px; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: transform 0.2s; display: inline-block; }
        .btn:hover { transform: scale(1.05); }

        .upload-area { display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed rgba(255,255,255,0.3); padding: 30px; border-radius: 15px; margin-bottom: 20px; cursor: pointer; transition: background 0.3s, border-color 0.3s; }
        .upload-area:hover { background: rgba(255,255,255,0.05); border-color: #f2d74e; }
        input[type="file"] { display: none; }
        
        .user-gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; margin-top: 20px; }
        
        /* Fixed Gallery Cards - No cutoffs */
        .user-photo-card { 
            height: 150px; 
            border-radius: 10px; 
            overflow: hidden; 
            border: 2px solid rgba(255,255,255,0.2); 
            background: #111; /* Dark background masks empty space */
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .user-photo-card:hover { transform: scale(1.05); border-color: #f2d74e; }
        .user-photo-card img { width: 100%; height: 100%; object-fit: contain; /* FIX: Prevents cropping */ }

        .messages-container { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; text-align: left; }
        .message-card { background: rgba(255, 255, 255, 0.1); padding: 20px; border-radius: 10px; border-left: 5px solid #f2d74e; }
        .message-card h4 { color: #f2d74e; margin-bottom: 5px; font-size: 1.2rem; }

        /* === OVERLAYS (PORTRAIT ZOOM & GALLERY LIGHTBOX) === */
        .fullscreen-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            z-index: 10000; opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease;
            display: flex; align-items: center; justify-content: center;
            perspective: 1000px; /* Needed for 3D mouse parallax */
        }
        .fullscreen-overlay.active { opacity: 1; pointer-events: auto; }

        /* Portrait Parallax Image */
        #portraitZoomImg {
            max-width: 90vw; max-height: 90vh;
            border: 15px solid #d4af37; border-radius: 5px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.9);
            transition: transform 0.1s ease-out; /* Smooth mouse tracking */
            will-change: transform;
            object-fit: contain;
        }

        /* Gallery Lightbox Elements */
        #lbImg { max-width: 85vw; max-height: 85vh; border-radius: 10px; box-shadow: 0 10px 50px rgba(0,0,0,0.8); object-fit: contain; }
        .lb-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.1); border: none; color: white;
            font-size: 2.5rem; width: 60px; height: 60px; border-radius: 50%;
            cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center;
        }
        .lb-btn:hover { background: rgba(255,255,255,0.3); color: #f2d74e; transform: translateY(-50%) scale(1.1); }
        #lbPrev { left: 5%; } #lbNext { right: 5%; }
        #lbClose, #ptClose { 
            position: absolute; top: 20px; right: 30px; font-size: 2rem; 
            background: transparent; border: none; color: rgba(255,255,255,0.7); 
            cursor: pointer; transition: 0.2s; 
        }
        #lbClose:hover, #ptClose:hover { color: #ff5555; transform: scale(1.1); }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            .p1, .p3 { transform: translate3d(0, -30px, -200px); }
            .p2, .p4 { transform: translate3d(0, -30px, -1500px); }
            .portrait { width: 280px; height: 380px; margin-left: -140px; margin-top: -190px; }
            .p5 { transform: translate3d(0, -30px, -6000px); width: 300px; height: 400px; margin-left: -150px; margin-top: -200px; }
            .upload-area { padding: 20px; } .upload-area h3 { font-size: 1.1rem; text-align: center; }
            .lb-btn { width: 45px; height: 45px; font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <canvas id="confettiCanvas"></canvas>

    <!-- Portrait Zoom Overlay -->
    <div class="fullscreen-overlay" id="portraitOverlay">
        <button id="ptClose">✖</button>
        <img id="portraitZoomImg" src="" alt="Zoomed Portrait">
    </div>

    <!-- Gallery Lightbox Overlay -->
    <div class="fullscreen-overlay" id="galleryLightbox">
        <button id="lbClose">✖</button>
        <button class="lb-btn" id="lbPrev">❮</button>
        <img id="lbImg" src="" alt="Gallery Fullscreen">
        <button class="lb-btn" id="lbNext">❯</button>
    </div>

    <div class="header-container">
        <header class="glass-panel">
            <h1>Happy 14th Birthday, Mahmoud!</h1>
            <p class="subtitle">I hope that all your dreams come true.</p>
        </header>
    </div>

    <!-- 3D SCROLL GALLERY -->
    <div class="scroll-gallery-wrapper" id="galleryWrapper">
        <div class="camera">
            <div class="scene" id="scene">
                <div class="floor"></div>
                <div class="decoration table-1">🎂🎉</div>
                <div class="decoration table-2">🍰🎈</div>
                <div class="decoration table-3">🎁🥳</div>
                <div class="decoration table-4">🍕🎉</div>

                <!-- Replace the src with your actual image files -->
                <div class="portrait p1"><img src="portrait1.jpeg" alt="Memory 1"></div>
                <div class="portrait p2"><img src="portrait2.jpeg" alt="Memory 2"></div>
                <div class="portrait p3"><img src="portrait3.jpeg" alt="Memory 3"></div>
                <div class="portrait p4"><img src="portrait4.jpeg" alt="Memory 4"></div>
                <div class="portrait p5"><img src="portrait5.jpeg" alt="Grand Finale"></div>
            </div>
            <div class="scroll-indicator">Keep Scrolling ↓</div>
        </div>
    </div>

    <!-- GUESTBOOK AND PHOTO UPLOAD -->
    <div class="interactive-container">
        <section class="glass-panel">
            <h2 style="color: #f2d74e; margin-bottom: 15px;">Party Photo Gallery</h2>
            <p style="margin-bottom: 20px;">Add your favorite photos from your camera roll!</p>
            
            <label class="upload-area" for="photoUpload">
                <h3 style="color: #e0e0e0;">📸 Click here to upload a photo</h3>
                <input type="file" id="photoUpload" accept="image/*">
            </label>

            <div class="user-gallery-grid" id="userGallery">
                <!-- Uploaded photos appear here -->
            </div>
        </section>

        <section class="glass-panel">
            <h2 style="color: #f2d74e; margin-bottom: 10px;">Put your messages for Mahmoud here!</h2>
            <div class="form-group">
                <input type="text" id="nameInput" placeholder="Your Name" required>
                <textarea id="messageInput" rows="3" placeholder="Write your birthday message here..." required></textarea>
                <button class="btn" id="submitBtn">Post Message</button>
            </div>
            <div class="messages-container" id="messagesList"></div>
        </section>
    </div>

    <script>
        // === 1. CONFETTI ===
        const canvas = document.getElementById('confettiCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const confettiParticles = [];
        const colors = ['#f2d74e', '#95c3de', '#ff9a9e', '#a18cd1', '#ffffff'];

        for (let i = 0; i < 100; i++) {
            confettiParticles.push({
                x: Math.random() * canvas.width, y: Math.random() * canvas.height - canvas.height,
                r: Math.random() * 6 + 4, d: Math.random() * 100 + 10,
                color: colors[Math.floor(Math.random() * colors.length)],
                tilt: Math.floor(Math.random() * 10) - 10, tiltAngleInc: (Math.random() * 0.07) + 0.05, tiltAngle: 0
            });
        }
        function drawConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < confettiParticles.length; i++) {
                const p = confettiParticles[i];
                ctx.beginPath(); ctx.lineWidth = p.r; ctx.strokeStyle = p.color;
                ctx.moveTo(p.x + p.tilt + p.r, p.y); ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r); ctx.stroke();
            }
            updateConfetti(); requestAnimationFrame(drawConfetti);
        }
        function updateConfetti() {
            for (let i = 0; i < confettiParticles.length; i++) {
                const p = confettiParticles[i];
                p.tiltAngle += p.tiltAngleInc; p.y += (Math.cos(p.d) + 1 + p.r / 2) / 2; p.x += Math.sin(p.tiltAngle);
                if (p.y > canvas.height) { p.x = Math.random() * canvas.width; p.y = -20; p.tilt = Math.floor(Math.random() * 10) - 10; }
            }
        }
        drawConfetti();

        // === 2. 3D CAMERA SCROLL ===
        const scene = document.getElementById('scene');
        const galleryWrapper = document.getElementById('galleryWrapper');
        let currentZ = 0, targetZ = 0;

        window.addEventListener('scroll', () => {
            const wrapperTop = galleryWrapper.offsetTop;
            const wrapperHeight = galleryWrapper.offsetHeight;
            const scrollY = window.scrollY;

            if (scrollY >= wrapperTop && scrollY <= wrapperTop + wrapperHeight) {
                let scrollProgress = (scrollY - wrapperTop) / (wrapperHeight - window.innerHeight);
                targetZ = scrollProgress * 7000; 
            }
        });

        function animateCamera() {
            currentZ += (targetZ - currentZ) * 0.08;
            scene.style.transform = `translateZ(${currentZ}px)`;
            requestAnimationFrame(animateCamera);
        }
        animateCamera();

        // === 3. PORTRAIT ZOOM & PARALLAX ===
        const portraitOverlay = document.getElementById('portraitOverlay');
        const portraitZoomImg = document.getElementById('portraitZoomImg');
        const ptClose = document.getElementById('ptClose');
        let isPortraitZoomed = false;
        let initialScrollY = 0;

        document.querySelectorAll('.portrait img').forEach(img => {
            img.parentElement.addEventListener('click', () => {
                portraitZoomImg.src = img.src;
                portraitOverlay.classList.add('active');
                portraitZoomImg.style.transform = `rotateY(0deg) rotateX(0deg) scale(1)`; // reset transform
                isPortraitZoomed = true;
                initialScrollY = window.scrollY; // Track scroll to exit
            });
        });

        // 3D Parallax effect on mouse move
        document.addEventListener('mousemove', (e) => {
            if (!isPortraitZoomed) return;
            // Calculate how far the mouse is from the center of the screen
            const x = (window.innerWidth / 2 - e.pageX) / 30;
            const y = (window.innerHeight / 2 - e.pageY) / 30;
            portraitZoomImg.style.transform = `rotateY(${x}deg) rotateX(${y}deg) scale(1.05)`;
        });

        // Close on scroll (must scroll more than 20px to prevent accidental mobile touches)
        window.addEventListener('scroll', () => {
            if (isPortraitZoomed && Math.abs(window.scrollY - initialScrollY) > 20) {
                closePortraitZoom();
            }
        });

        function closePortraitZoom() {
            portraitOverlay.classList.remove('active');
            setTimeout(() => { isPortraitZoomed = false; }, 300);
        }
        ptClose.addEventListener('click', closePortraitZoom);
        portraitOverlay.addEventListener('click', (e) => { if (e.target === portraitOverlay) closePortraitZoom(); });

        // === 4. GALLERY UPLOAD & LIGHTBOX ===
        const photoUpload = document.getElementById('photoUpload');
        const userGallery = document.getElementById('userGallery');
        const galleryLightbox = document.getElementById('galleryLightbox');
        const lbImg = document.getElementById('lbImg');
        let currentGalleryIndex = 0;
        let currentGalleryImages = [];

        document.addEventListener('DOMContentLoaded', loadUserPhotos);

        photoUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const compCanvas = document.createElement('canvas');
                    const compCtx = compCanvas.getContext('2d');
                    const MAX_WIDTH = 500; // Increased slightly for better lightbox quality
                    const scaleSize = MAX_WIDTH / img.width;
                    compCanvas.width = MAX_WIDTH; compCanvas.height = img.height * scaleSize;
                    compCtx.drawImage(img, 0, 0, compCanvas.width, compCanvas.height);
                    
                    const compressedDataUrl = compCanvas.toDataURL('image/jpeg', 0.8);
                    saveUserPhoto(compressedDataUrl);
                    displayUserPhoto(compressedDataUrl);
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        function displayUserPhoto(dataUrl) {
            const card = document.createElement('div');
            card.classList.add('user-photo-card');
            card.innerHTML = `<img src="${dataUrl}" alt="User uploaded photo">`;
            
            // Open lightbox on click
            card.addEventListener('click', () => {
                const nodes = Array.from(userGallery.children);
                const index = nodes.indexOf(card);
                openLightbox(index);
            });
            
            userGallery.prepend(card);
        }

        function openLightbox(index) {
            // Get all current photos in the grid dynamically
            currentGalleryImages = Array.from(document.querySelectorAll('.user-photo-card img')).map(img => img.src);
            if (currentGalleryImages.length === 0) return;
            currentGalleryIndex = index;
            lbImg.src = currentGalleryImages[currentGalleryIndex];
            galleryLightbox.classList.add('active');
        }

        // Lightbox Navigation
        document.getElementById('lbPrev').addEventListener('click', (e) => {
            e.stopPropagation(); // Prevents clicking the background overlay
            currentGalleryIndex = (currentGalleryIndex - 1 + currentGalleryImages.length) % currentGalleryImages.length;
            lbImg.src = currentGalleryImages[currentGalleryIndex];
        });

        document.getElementById('lbNext').addEventListener('click', (e) => {
            e.stopPropagation();
            currentGalleryIndex = (currentGalleryIndex + 1) % currentGalleryImages.length;
            lbImg.src = currentGalleryImages[currentGalleryIndex];
        });

        document.getElementById('lbClose').addEventListener('click', () => galleryLightbox.classList.remove('active'));
        galleryLightbox.addEventListener('click', (e) => { if (e.target === galleryLightbox) galleryLightbox.classList.remove('active'); });

        function saveUserPhoto(dataUrl) {
            try {
                let photos = JSON.parse(localStorage.getItem('mahmoudPhotos')) || [];
                photos.push(dataUrl);
                localStorage.setItem('mahmoudPhotos', JSON.stringify(photos));
            } catch (e) { alert("Gallery storage is full! Browser memory limit reached."); }
        }
        function loadUserPhotos() {
            let photos = JSON.parse(localStorage.getItem('mahmoudPhotos')) || [];
            photos.forEach(displayUserPhoto);
        }

        // === 5. GUESTBOOK MESSAGES ===
        const submitBtn = document.getElementById('submitBtn');
        const nameInput = document.getElementById('nameInput');
        const messageInput = document.getElementById('messageInput');
        const messagesList = document.getElementById('messagesList');

        document.addEventListener('DOMContentLoaded', loadMessages);

        submitBtn.addEventListener('click', function() {
            const name = nameInput.value.trim();
            const message = messageInput.value.trim();
            if (name === '' || message === '') return alert('Please fill out both fields!');

            const msgObj = { name: name, text: message };
            let msgs = JSON.parse(localStorage.getItem('mahmoudMsgs')) || [];
            msgs.push(msgObj);
            localStorage.setItem('mahmoudMsgs', JSON.stringify(msgs));
            
            displayMessage(msgObj);
            nameInput.value = ''; messageInput.value = '';
        });

        function displayMessage(msg) {
            const card = document.createElement('div');
            card.classList.add('message-card');
            card.innerHTML = `<h4>${msg.name}</h4><p>${msg.text}</p>`;
            messagesList.prepend(card);
        }
        function loadMessages() {
            let msgs = JSON.parse(localStorage.getItem('mahmoudMsgs')) || [];
            msgs.forEach(displayMessage);
        }
    </script>
</body>
</html>
